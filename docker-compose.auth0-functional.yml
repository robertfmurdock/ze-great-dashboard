# A test-only overlay on the ordinary Compose server service. The functional runner supplies the
# fixture origins and board name at invocation time; this file only gives that normal server an
# isolated host port and a stable route back to its host-owned fixtures.
services:
  server:
    ports: !override
      - '127.0.0.1:${FUNCTIONAL_SERVER_PORT:-0}:3000'
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # Do not inherit a developer's BOARD setting from .env: this runner has one deliberate board.
      BOARD: ${FUNCTIONAL_BOARD:?Set by scripts/auth0-functional.mjs}
