AWSTemplateFormatVersion: '2010-09-09'
Description: Ze Great Dashboard application infrastructure

Parameters:
  Name:
    Type: String
    Default: ze-great-dashboard
  GitHubRepository:
    Type: String
    Description: owner/repository allowed to assume the deployment role
  GitHubOwnerId:
    Type: String
    Description: numeric GitHub owner id
  GitHubRepositoryId:
    Type: String
    Description: numeric GitHub repository id
  AssetsDomain:
    Type: String
    Default: public-assets.zegreatrob.com
    Description: optional public hostname for the client asset distribution
  AssetsCertificateArn:
    Type: String
    Default: arn:aws:acm:us-east-1:174159267544:certificate/8cf94ea9-b380-45dc-a773-afe54a35608b
    Description: us-east-1 ACM certificate ARN covering AssetsDomain

Rules:
  AssetsDomainRequiresCertificate:
    RuleCondition: !Not [!Equals [!Ref AssetsDomain, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref AssetsCertificateArn, '']]
        AssertDescription: AssetsCertificateArn is required when AssetsDomain is set

Conditions:
  HasAssetsDomain: !Not [!Equals [!Ref AssetsDomain, '']]

Resources:
  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${Name}-assets'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      # Existing buckets cannot become unversioned; Suspended stops new versions.
      VersioningConfiguration:
        Status: Suspended

  AssetsOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${Name}-assets'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AssetsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: !If
          - HasAssetsDomain
          - [!Ref AssetsDomain]
          - !Ref AWS::NoValue
        Comment: !Sub '${Name} client assets'
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - DomainName: !GetAtt AssetsBucket.RegionalDomainName
            Id: assets
            OriginAccessControlId: !Ref AssetsOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: assets
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 5cc3b908-e619-4b99-88e5-2cf7f45965bd
        ViewerCertificate: !If
          - HasAssetsDomain
          - AcmCertificateArn: !Ref AssetsCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true

  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${AssetsBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${AssetsDistribution}'

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      # Kept stable for the one-time bootstrap policy and exposed as the deployment contract.
      RoleName: ZeGreatDashboardDeploy
      Description: !Sub 'GitHub Actions release role for ${GitHubRepository}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub
                  - 'repo:${Owner}@${GitHubOwnerId}/${Repository}@${GitHubRepositoryId}:ref:refs/heads/main'
                  - Owner:
                      Fn::Select:
                        - 0
                        - Fn::Split: ['/', !Ref GitHubRepository]
                    Repository:
                      Fn::Select:
                        - 1
                        - Fn::Split: ['/', !Ref GitHubRepository]
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishAssets
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !GetAtt AssetsBucket.Arn
                  - !Sub '${AssetsBucket.Arn}/*'

  ReferenceArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: ze-great-dashboard-reference-artifacts
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      # Existing buckets cannot become unversioned; Suspended stops new versions.
      VersioningConfiguration: { Status: Suspended }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ReferenceCloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ZeGreatDashboardReferenceCloudFormationExecution
      Description: CloudFormation execution role for the consumer reference
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ReferenceStackResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReferenceLambda
                Effect: Allow
                Action: lambda:*
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:ze-great-dashboard-reference'
              - Sid: ReferenceLogs
                Effect: Allow
                Action: logs:*
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ze-great-dashboard-reference:*'
              - Sid: ReadReferenceArtifact
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${ReferenceArtifactBucket.Arn}/lambda/*'
              - Sid: ReferenceServerRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ze-great-dashboard-reference-*'

  GitHubReferenceDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ZeGreatDashboardReferenceDeploy
      Description: !Sub 'Main-only GitHub consumer reference role for ${GitHubRepository}'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub
                  - 'repo:${Owner}@${GitHubOwnerId}/${Repository}@${GitHubRepositoryId}:ref:refs/heads/main'
                  - Owner:
                      Fn::Select: [0, { Fn::Split: ['/', !Ref GitHubRepository] }]
                    Repository:
                      Fn::Select: [1, { Fn::Split: ['/', !Ref GitHubRepository] }]
      Policies:
        - PolicyName: DeployReferenceConsumer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: UploadReferenceArtifact
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${ReferenceArtifactBucket.Arn}/*'
              - Sid: InspectReferenceArtifactBucket
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: !GetAtt ReferenceArtifactBucket.Arn
              - Sid: OperateReferenceStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DeleteStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ze-great-dashboard-reference/*'
              - Sid: PassReferenceExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt ReferenceCloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': cloudformation.amazonaws.com
              - Sid: TestReferencePrivateLambda
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:ze-great-dashboard-reference'

Outputs:
  AssetsBucket:
    Value: !Ref AssetsBucket
  AssetsBaseUrl:
    Value: !If
      - HasAssetsDomain
      - !Sub 'https://${AssetsDomain}'
      - !Sub 'https://${AssetsDistribution.DomainName}'
  AssetsDistributionDomain:
    Value: !GetAtt AssetsDistribution.DomainName
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  ReferenceArtifactBucket:
    Value: !Ref ReferenceArtifactBucket
  ReferenceDeployRoleArn:
    Value: !GetAtt GitHubReferenceDeployRole.Arn
  ReferenceExecutionRoleArn:
    Value: !GetAtt ReferenceCloudFormationExecutionRole.Arn
