AWSTemplateFormatVersion: '2010-09-09'
Description: Ze Great Dashboard application infrastructure

Parameters:
  Name:
    Type: String
    Default: ze-great-dashboard
  GitHubRepository:
    Type: String
    Description: owner/repository allowed to assume the deployment role
  GitHubOwnerId:
    Type: String
    Description: numeric GitHub owner id
  GitHubRepositoryId:
    Type: String
    Description: numeric GitHub repository id

Resources:
  AssetsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${Name}-assets'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  AssetsOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${Name}-assets'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  AssetsDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${Name} client assets'
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - DomainName: !GetAtt AssetsBucket.RegionalDomainName
            Id: assets
            OriginAccessControlId: !Ref AssetsOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: assets
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          ResponseHeadersPolicyId: 5cc3b908-e619-4b99-88e5-2cf7f45965bd
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  AssetsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref AssetsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${AssetsBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${AssetsDistribution}'

  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Name}-server'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  ServerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${Name}'
      RetentionInDays: 14

  ServerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ServerLogGroup
    Properties:
      FunctionName: !Ref Name
      Architectures: [arm64]
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt ServerRole.Arn
      Environment:
        Variables:
          ASSET_PATH: !Sub 'https://${AssetsDistribution.DomainName}/dashboard/none'
          BOARD_CONFIG_URL: ./board.yaml
          HOST: 0.0.0.0
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 503, body: 'Not deployed yet.' });

  ServerUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ServerFunction.Arn
      AuthType: NONE

  ServerUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ServerFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  ServerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ServerFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      # Kept stable for the one-time bootstrap policy and exposed as the deployment contract.
      RoleName: ZeGreatDashboardDeploy
      Description: !Sub 'GitHub Actions release role for ${GitHubRepository}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub
                  - 'repo:${Owner}@${GitHubOwnerId}/${Repository}@${GitHubRepositoryId}:ref:refs/heads/main'
                  - Owner:
                      Fn::Select:
                        - 0
                        - Fn::Split: ['/', !Ref GitHubRepository]
                    Repository:
                      Fn::Select:
                        - 1
                        - Fn::Split: ['/', !Ref GitHubRepository]
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PublishAssets
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:DeleteObject
                Resource:
                  - !GetAtt AssetsBucket.Arn
                  - !Sub '${AssetsBucket.Arn}/*'
              - Sid: UpdateServer
                Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                Resource: !GetAtt ServerFunction.Arn

Outputs:
  AssetsBucket:
    Value: !Ref AssetsBucket
  AssetsBaseUrl:
    Value: !Sub 'https://${AssetsDistribution.DomainName}'
  AssetsDistributionDomain:
    Value: !GetAtt AssetsDistribution.DomainName
  ServerFunctionName:
    Value: !Ref ServerFunction
  ServerUrl:
    Value: !GetAtt ServerUrl.FunctionUrl
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
