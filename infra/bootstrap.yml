AWSTemplateFormatVersion: '2010-09-09'
Description: One-time GitHub OIDC bootstrap for Ze Great Dashboard

Parameters:
  GitHubRepository:
    Type: String
    Default: robertfmurdock/ze-great-dashboard

Resources:
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: ZeGreatDashboardCloudFormationExecution
      Description: CloudFormation execution role for Ze Great Dashboard
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ZeGreatDashboardResources
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AssetsBucket
                Effect: Allow
                Action: s3:*
                Resource:
                  - arn:aws:s3:::ze-great-dashboard-assets
                  - arn:aws:s3:::ze-great-dashboard-assets/*
              - Sid: CloudFront
                Effect: Allow
                Action: cloudfront:*
                Resource: '*'
              - Sid: DashboardLambda
                Effect: Allow
                Action: lambda:*
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:ze-great-dashboard'
              - Sid: DashboardLogs
                Effect: Allow
                Action: logs:*
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/ze-great-dashboard:*'
              - Sid: DashboardRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:GetRole
                  - iam:DeleteRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ze-great-dashboard-server'
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/ZeGreatDashboardDeploy'

  GitHubProvisionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: ZeGreatDashboardProvision
      Description: Main-only GitHub CloudFormation role for Ze Great Dashboard
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                'token.actions.githubusercontent.com:aud': sts.amazonaws.com
                'token.actions.githubusercontent.com:sub': !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
      Policies:
        - PolicyName: ZeGreatDashboardCloudFormation
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: OperateDashboardStack
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/ze-great-dashboard/*'
              - Sid: PassCloudFormationExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    'iam:PassedToService': cloudformation.amazonaws.com

Outputs:
  ProvisionRoleArn:
    Value: !GetAtt GitHubProvisionRole.Arn
  ExecutionRoleArn:
    Value: !GetAtt CloudFormationExecutionRole.Arn
