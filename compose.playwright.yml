services:
  playwright:
    image: mcr.microsoft.com/playwright:v${PLAYWRIGHT_VERSION:?Set PLAYWRIGHT_VERSION}-noble
    init: true
    ipc: host
    ports:
      - target: 3000
        published: 0
        host_ip: 127.0.0.1
    extra_hosts:
      - host.docker.internal:host-gateway
    working_dir: /workspace
    volumes:
      - .:/workspace:ro
    command:
      - npx
      - playwright
      - run-server
      - --port
      - '3000'
      - --host
      - 0.0.0.0
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const s=require('node:net').connect(3000,'127.0.0.1',
          ()=>{s.end();process.exit(0)});s.on('error',()=>process.exit(1))"
      interval: 1s
      timeout: 1s
      retries: 30
