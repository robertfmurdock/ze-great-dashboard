AWSTemplateFormatVersion: '2010-09-09'
Description: Ze Great Dashboard private Lambda application (integrate through a customer-managed gateway)

Metadata:
  PackageManagedParameters: [ComputeMode, LambdaArtifactKey, AssetPath]

Parameters:
  ComputeMode: { Type: String, Default: lambda, AllowedValues: [lambda] }
  Name: { Type: String, Default: dashboard }
  LambdaArtifactBucket: { Type: String }
  LambdaArtifactKey: { Type: String }
  AssetPath: { Type: String }
  BoardConfigPath: { Type: String, Default: ./board.yaml }
  MemorySize: { Type: Number, Default: 256, MinValue: 128 }
  Timeout: { Type: Number, Default: 10, MinValue: 1, MaxValue: 900 }
  LogRetentionInDays: { Type: Number, Default: 14, MinValue: 1 }
  ReservedConcurrentExecutions: { Type: Number, Default: 0, MinValue: 0 }
  # ARN of a Secrets Manager JSON object or Parameter Store SecureString such as
  # {"GITHUB_TOKEN":"github_pat_..."}. The value stays server-side; this ARN is the only
  # credential-related Lambda setting.
  SecretReference: { Type: String, Default: '' }

Conditions:
  HasSecretReference: !Not [!Equals [!Ref SecretReference, '']]
  HasReservedConcurrency: !Not [!Equals [!Ref ReservedConcurrentExecutions, 0]]

Resources:
  ServerRole:
    Type: AWS::IAM::Role
    Properties:
      # A stable, Name-derived role name lets consumer bootstrap policies scope CloudFormation
      # execution to this stack's runtime role rather than every role in the account.
      RoleName: !Sub '${Name}-server'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{ Effect: Allow, Principal: { Service: lambda.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole]
      Policies:
        - PolicyName: read-consumer-credentials
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [secretsmanager:DescribeSecret, secretsmanager:GetSecretValue]
                # IAM requires every statement to have a resource. When no secret is configured,
                # keep this read permission pointed at a nonexistent ARN rather than widening it.
                Resource: !If
                  - HasSecretReference
                  - !Ref SecretReference
                  - !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:ze-great-dashboard-no-secret-configured'
              - Effect: Allow
                Action: ssm:GetParameter
                # The same reference may instead be an SSM parameter ARN. The opposite service's
                # statement cannot authorize a resource of the other service.
                Resource: !If
                  - HasSecretReference
                  - !Ref SecretReference
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/ze-great-dashboard-no-credential-configured'
              - Effect: Allow
                Action: kms:Decrypt
                Resource: '*'
                # Parameter Store supplies this encryption context itself. This permits decryption
                # only while SSM reads this exact configured parameter, including custom KMS keys.
                Condition:
                  StringEquals:
                    'kms:ViaService': !Sub 'ssm.${AWS::Region}.amazonaws.com'
                    'kms:EncryptionContext:PARAMETER_ARN': !Ref SecretReference
  ServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { RetentionInDays: !Ref LogRetentionInDays, LogGroupName: !Sub '/aws/lambda/${Name}' }
  ServerFunction:
    Type: AWS::Lambda::Function
    DependsOn: ServerLogGroup
    Properties:
      FunctionName: !Ref Name
      Architectures: [arm64]
      Runtime: nodejs22.x
      Handler: index.handler
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      ReservedConcurrentExecutions: !If [HasReservedConcurrency, !Ref ReservedConcurrentExecutions, !Ref AWS::NoValue]
      Role: !GetAtt ServerRole.Arn
      Code: { S3Bucket: !Ref LambdaArtifactBucket, S3Key: !Ref LambdaArtifactKey }
      Environment:
        Variables:
          ASSET_PATH: !Ref AssetPath
          BOARD_CONFIG_URL: !Ref BoardConfigPath
          HOST: 0.0.0.0
          SECRET_REFERENCE: !If [HasSecretReference, !Ref SecretReference, !Ref AWS::NoValue]
Outputs:
  ServerFunctionName: { Value: !Ref ServerFunction }
  ServerFunctionArn: { Value: !GetAtt ServerFunction.Arn }
  AssetPath: { Value: !Ref AssetPath }
