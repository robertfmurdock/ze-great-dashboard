# Test-only overlay used by the shared packaged-server endpoint runner.
services:
  server:
    image: ${DASHBOARD_IMAGE:?Set by scripts/container-endpoint.mjs}
    env_file: !reset []
    ports: !override
      - '127.0.0.1:${ENDPOINT_SERVER_PORT:-0}:3000'
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # Do not inherit a developer's BOARD setting from .env: this runner has one deliberate board.
      BOARD: ${ENDPOINT_BOARD:?Set by scripts/container-endpoint.mjs}
