# The deployed shape, locally: one server, pointed at a published client version.
#
# This is not the loop for cosmetic work — use `npm run dev` for that, it has HMR. This is for
# reproducing what production does, and for confirming a published client version renders without
# building the client at all.
#
# Reads a gitignored `.env`; see `.env.example` for the variables.
services:
  server:
    build: .
    ports:
      - '3000:3000'
    environment:
      # No default. Compose warns and the server refuses to start without it, which beats silently
      # serving the wrong client.
      ASSET_PATH: ${ASSET_PATH:?set ASSET_PATH in .env — see .env.example}
      PROXY_PATH: ${PROXY_PATH:-/api}
      BOARD_CONFIG_URL: ${BOARD_CONFIG_URL:-./boards/example.yaml}
      HOST: 0.0.0.0
      PORT: '3000'
    # A refused start is a configuration error to read and fix, not something to retry into a
    # crash loop that buries the message.
    restart: 'no'
