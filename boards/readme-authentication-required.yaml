# yaml-language-server: $schema=https://public-assets.zegreatrob.com/dashboard/0.18.0/board-config.schema.json
# Source-free board used only to start the README's fail-closed security capture.
boards:
  readme-authentication-required:
    panels:
      - id: capture-shell
        label: Capture shell
        type: http-value
        url: https://example.invalid/readme-capture
        position: { h: 1, w: 1, x: 0, y: 0 }

sources: {}
security: required
