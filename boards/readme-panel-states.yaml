# yaml-language-server: $schema=https://public-assets.zegreatrob.com/dashboard/1.0.0/board-config.schema.json
# Source-free board used for the README's deterministic panel-state gallery. The capture script
# supplies the signal envelopes in the browser, so this never calls a live authority.
boards:
  readme-panel-states:
    panels:
      - id: api-build
        label: API Build
        type: pipeline-status
        position: { h: 4, w: 6, x: 0, y: 0 }
      - id: unit-tests
        label: Unit Tests
        type: pipeline-status
        running_animation: off
        position: { h: 4, w: 6, x: 6, y: 0 }
      - id: deploy-staging
        label: Deploy to Staging
        type: pipeline-status
        position: { h: 4, w: 6, x: 0, y: 4 }
      - id: release
        label: Release
        type: pipeline-status
        position: { h: 4, w: 6, x: 6, y: 4 }
      - id: dependency-audit
        label: Dependency Audit
        type: pipeline-status
        position: { h: 4, w: 6, x: 0, y: 8 }
      - id: docs-preview
        label: Docs Preview
        type: http-value
        url: https://docs.example.invalid/preview
        position: { h: 4, w: 6, x: 6, y: 8 }

sources: {}
