# The real team radiator configuration. This is intentionally separate from example.yaml so
# changes made for visual use do not become part of the smallest schema/demo fixture.

sources:
  coupling:
    type: github-actions
    repo: robertfmurdock/coupling
    branch: master
    token_env: GITHUB_TOKEN
  jsmints:
    type: github-actions
    repo: robertfmurdock/jsmints
    branch: master
    token_env: GITHUB_TOKEN
  testmints:
    type: github-actions
    repo: robertfmurdock/testmints
    branch: master
    token_env: GITHUB_TOKEN
  ze-great-tools:
    type: github-actions
    repo: robertfmurdock/ze-great-tools
    branch: main
    token_env: GITHUB_TOKEN
  ze-great-dashboard:
    type: github-actions
    repo: robertfmurdock/ze-great-dashboard
    branch: main
    token_env: GITHUB_TOKEN

boards:
  ze-great-team:
    refresh: 60s
    panels:
      # Build health gets the first screen: each pipeline owns one full-width scan row.
      - id: coupling-build
        label: Coupling
        type: pipeline-status
        display: primary
        source: coupling
        pipeline: main.yml
        position: { x: 0, y: 0, w: 12, h: 2 }

      - id: jsmints-build
        label: JSmints
        type: pipeline-status
        display: primary
        source: jsmints
        pipeline: main.yml
        position: { x: 0, y: 2, w: 12, h: 2 }

      - id: testmints-build
        label: Testmints
        type: pipeline-status
        display: primary
        source: testmints
        pipeline: main.yml
        position: { x: 0, y: 4, w: 12, h: 2 }

      - id: ze-great-tools-build
        label: Tools
        type: pipeline-status
        display: primary
        source: ze-great-tools
        pipeline: main.yml
        position: { x: 0, y: 6, w: 12, h: 2 }

      - id: ze-great-dashboard-build
        label: Dashboard
        type: pipeline-status
        display: primary
        source: ze-great-dashboard
        pipeline: main.yml
        position: { x: 0, y: 8, w: 12, h: 2 }

      # Published versions share the final row.
      - id: tagger-latest-version
        label: Tagger
        type: http-value
        display: compact
        url: https://registry.npmjs.org/@continuous-excellence%2Ftagger/latest
        json_path: $.version
        link: https://www.npmjs.com/package/@continuous-excellence/tagger
        refresh: 15m
        position: { x: 0, y: 10, w: 3, h: 2 }

      - id: coupling-latest-version
        label: Coupling
        type: http-value
        display: compact
        url: https://registry.npmjs.org/@continuous-excellence%2Fcoupling-cli/latest
        json_path: $.version
        link: https://www.npmjs.com/package/@continuous-excellence/coupling-cli
        refresh: 15m
        position: { x: 3, y: 10, w: 3, h: 2 }

      - id: jsmints-latest-version
        label: JSmints
        type: http-value
        display: compact
        url: 'https://search.maven.org/solrsearch/select?q=g%3A%22com.zegreatrob.jsmints%22%20AND%20a%3A%22plugins%22&rows=1&wt=json'
        json_path: $.response.docs[0].latestVersion
        link: https://central.sonatype.com/artifact/com.zegreatrob.jsmints/plugins
        refresh: 15m
        position: { x: 6, y: 10, w: 3, h: 2 }

      - id: testmints-latest-version
        label: Testmints
        type: http-value
        display: compact
        url: 'https://search.maven.org/solrsearch/select?q=g%3A%22com.zegreatrob.testmints%22%20AND%20a%3A%22report%22&rows=1&wt=json'
        json_path: $.response.docs[0].latestVersion
        link: https://central.sonatype.com/artifact/com.zegreatrob.testmints/report
        refresh: 15m
        position: { x: 9, y: 10, w: 3, h: 2 }
