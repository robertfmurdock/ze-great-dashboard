# The real team radiator configuration. This is intentionally separate from example.yaml so
# changes made for visual use do not become part of the smallest schema/demo fixture.

sources:
  coupling:
    type: github-actions
    repo: robertfmurdock/coupling
    branch: master
    token_env: GITHUB_TOKEN
  jsmints:
    type: github-actions
    repo: robertfmurdock/jsmints
    branch: master
    token_env: GITHUB_TOKEN
  testmints:
    type: github-actions
    repo: robertfmurdock/testmints
    branch: master
    token_env: GITHUB_TOKEN
  ze-great-tools:
    type: github-actions
    repo: robertfmurdock/ze-great-tools
    branch: main
    token_env: GITHUB_TOKEN
  ze-great-dashboard:
    type: github-actions
    repo: robertfmurdock/ze-great-dashboard
    branch: main
    token_env: GITHUB_TOKEN

boards:
  ze-great-team:
    refresh: 60s
    panels:
      # Build health: two balanced rows. Keep the whole radiator within the first 12 grid rows.
      - id: coupling-build
        type: pipeline-status
        display: primary
        source: coupling
        pipeline: main.yml
        position: { x: 0, y: 0, w: 6, h: 4 }

      - id: jsmints-build
        type: pipeline-status
        display: primary
        source: jsmints
        pipeline: main.yml
        position: { x: 6, y: 0, w: 6, h: 4 }

      - id: testmints-build
        type: pipeline-status
        display: primary
        source: testmints
        pipeline: main.yml
        position: { x: 0, y: 4, w: 4, h: 4 }

      - id: ze-great-tools-build
        type: pipeline-status
        display: primary
        source: ze-great-tools
        pipeline: main.yml
        position: { x: 4, y: 4, w: 4, h: 4 }

      - id: ze-great-dashboard-build
        type: pipeline-status
        display: primary
        source: ze-great-dashboard
        pipeline: main.yml
        position: { x: 8, y: 4, w: 4, h: 4 }

      # Related change health: compact context beneath the canonical build signals.
      - id: coupling-update-health
        type: pull-request-health
        display: compact
        source: coupling
        base_branch: master
        update_workflows:
          - workflow: dependency-update.yml
            branch_prefixes: [cpr-gradle-update/]
          - workflow: update-gradle-wrapper.yml
            branch_prefixes: [create-pull-request/]
        build_workflow: main.yml
        position: { x: 0, y: 8, w: 3, h: 2 }

      - id: jsmints-update-health
        type: pull-request-health
        display: compact
        source: jsmints
        base_branch: master
        update_workflows:
          - workflow: gradle-update.yml
            branch_prefixes: [cpr-gradle-update/]
          - workflow: update-gradle-wrapper.yml
            branch_prefixes: [cpr/]
        build_workflow: main.yml
        position: { x: 3, y: 8, w: 3, h: 2 }

      - id: testmints-update-health
        type: pull-request-health
        display: compact
        source: testmints
        base_branch: master
        update_workflows:
          - workflow: gradle-update.yml
            branch_prefixes: [create-pull-request/]
          - workflow: update-gradle-wrapper.yml
            branch_prefixes: [create-pull-request/]
        build_workflow: main.yml
        position: { x: 6, y: 8, w: 3, h: 2 }

      - id: ze-great-tools-update-health
        type: pull-request-health
        display: compact
        source: ze-great-tools
        base_branch: main
        update_workflows:
          - workflow: gradle-update.yml
            branch_prefixes: [cpr-gradle-update/]
          - workflow: update-gradle-wrapper.yml
            branch_prefixes: [create-pull-request/]
        build_workflow: main.yml
        position: { x: 9, y: 8, w: 3, h: 2 }

      # Published versions: compact supporting context beneath the actionable signals.
      - id: tagger-latest-version
        type: http-value
        display: compact
        url: https://registry.npmjs.org/@continuous-excellence%2Ftagger/latest
        json_path: $.version
        link: https://www.npmjs.com/package/@continuous-excellence/tagger
        refresh: 15m
        position: { x: 0, y: 10, w: 3, h: 2 }

      - id: coupling-latest-version
        type: http-value
        display: compact
        url: https://registry.npmjs.org/@continuous-excellence%2Fcoupling-cli/latest
        json_path: $.version
        link: https://www.npmjs.com/package/@continuous-excellence/coupling-cli
        refresh: 15m
        position: { x: 3, y: 10, w: 3, h: 2 }

      - id: jsmints-latest-version
        type: http-value
        display: compact
        url: 'https://search.maven.org/solrsearch/select?q=g%3A%22com.zegreatrob.jsmints%22%20AND%20a%3A%22plugins%22&rows=1&wt=json'
        json_path: $.response.docs[0].latestVersion
        link: https://central.sonatype.com/artifact/com.zegreatrob.jsmints/plugins
        refresh: 15m
        position: { x: 6, y: 10, w: 3, h: 2 }

      - id: testmints-latest-version
        type: http-value
        display: compact
        url: 'https://search.maven.org/solrsearch/select?q=g%3A%22com.zegreatrob.testmints%22%20AND%20a%3A%22report%22&rows=1&wt=json'
        json_path: $.response.docs[0].latestVersion
        link: https://central.sonatype.com/artifact/com.zegreatrob.testmints/report
        refresh: 15m
        position: { x: 9, y: 10, w: 3, h: 2 }
