# Small public board used by the quickstart and schema tests. Keep this intentionally simple;
# realistic team configurations belong in their own files (for example ze-great-team.yaml).

sources:
  example-github:
    type: github-actions
    repo: actions/checkout
    token_env: GITHUB_TOKEN

boards:
  example:
    refresh: 60s
    panels:
      - id: example-build
        type: pipeline-status
        source: example-github
        pipeline: '88506573'
        position: { x: 0, y: 0, w: 12, h: 4 }
