name: ze-great-dashboard-gitlab-functional

services:
  caddy:
    image: caddy:2.11.2-alpine
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        aliases: [gitlab.test]

  gitlab:
    image: gitlab/gitlab-ce:19.3.1-ce.0
    hostname: gitlab
    shm_size: 256m
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD}
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'https://gitlab.test'
        nginx['listen_port'] = 80
        nginx['listen_https'] = false
        gitlab_rails['gitlab_shell_ssh_port'] = 2224
    volumes:
      - gitlab_config:/etc/gitlab
      - gitlab_logs:/var/log/gitlab
      - gitlab_data:/var/opt/gitlab

  assets:
    image: nginx:1.29-alpine
    volumes:
      - ./assets:/usr/share/nginx/html:ro

  dashboard:
    build:
      context: ../..
      args:
        ASSET_PATH: http://assets/__ASSET_PATH__
    environment:
      ASSET_PATH: http://assets/__ASSET_PATH__
      BOARD_CONFIG_URL: /experiment/board.yaml
      GITLAB_DASHBOARD_TOKEN: ${GITLAB_DASHBOARD_TOKEN}
      NODE_EXTRA_CA_CERTS: /caddy/caddy/pki/authorities/local/root.crt
    volumes:
      - ./board.yaml:/experiment/board.yaml:ro
      - caddy_data:/caddy:ro
    depends_on: [assets, caddy]

  runner:
    image: gitlab/gitlab-runner:alpine-v19.3.1
    restart: unless-stopped
    volumes:
      - runner_config:/etc/gitlab-runner
      - /var/run/docker.sock:/var/run/docker.sock
      - caddy_data:/caddy:ro

  runner-register:
    image: gitlab/gitlab-runner:alpine-v19.3.1
    profiles: [tools]
    volumes:
      - runner_config:/etc/gitlab-runner
      - caddy_data:/caddy:ro
      - ./.state:/state:ro
      - ./runner.template.toml:/experiment/runner.template.toml:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        token=$$(sed -n 's/.*"runnerToken":"\([^"]*\)".*/\1/p' /state/project.json)
        test -n "$$token"
        gitlab-runner register --non-interactive --url https://gitlab.test --token "$$token" \
          --executor docker --docker-image alpine:3.22 --docker-pull-policy if-not-present \
          --description dashboard-functional --tls-ca-file /caddy/caddy/pki/authorities/local/root.crt \
          --template-config /experiment/runner.template.toml

  seed:
    image: node:24-alpine
    profiles: [tools]
    environment:
      GITLAB_DASHBOARD_TOKEN: ${GITLAB_DASHBOARD_TOKEN}
      NODE_EXTRA_CA_CERTS: /caddy/caddy/pki/authorities/local/root.crt
    volumes:
      - ./:/experiment:ro
      - ./.state:/state
      - caddy_data:/caddy:ro
    command: ["node", "/experiment/seed.mjs"]

  probe:
    image: node:24-alpine
    profiles: [tools]
    volumes:
      - ./:/experiment:ro
    command: ["node", "/experiment/probe.mjs"]
    depends_on: [dashboard]

  retry:
    image: node:24-alpine
    profiles: [tools]
    environment:
      GITLAB_DASHBOARD_TOKEN: ${GITLAB_DASHBOARD_TOKEN}
      NODE_EXTRA_CA_CERTS: /caddy/caddy/pki/authorities/local/root.crt
    volumes:
      - ./:/experiment:ro
      - ./.state:/state:ro
      - caddy_data:/caddy:ro
    command: ["node", "/experiment/retry.mjs"]

volumes:
  caddy_data:
  caddy_config:
  gitlab_config:
  gitlab_logs:
  gitlab_data:
  runner_config:
