# The release-only credential smoke board forces Lambda cold start to load the fake credential map.
# It never calls GitHub: the main workflow invokes only /health after deployment.
sources:
  smoke-github:
    type: github-actions
    repo: actions/checkout
    token_env: GITHUB_TOKEN

boards:
  reference:
    refresh: 60s
    panels:
      - id: release-reference
        type: release-reference
        position: { x: 0, y: 0, w: 12, h: 6 }
