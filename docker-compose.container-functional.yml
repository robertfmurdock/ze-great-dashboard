# Test-only overlay used by the shared packaged-server functional runner.
services:
  server:
    image: ${DASHBOARD_IMAGE:?Set by scripts/container-functional.mjs}
    env_file: !reset []
    ports: !override
      - '127.0.0.1:${FUNCTIONAL_SERVER_PORT:-0}:3000'
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # Do not inherit a developer's BOARD setting from .env: this runner has one deliberate board.
      BOARD: ${FUNCTIONAL_BOARD:?Set by scripts/container-functional.mjs}
