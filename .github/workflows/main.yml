name: Build
on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: |
          cd "$RUNNER_TEMP"
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Check 🔎
        env:
          PLAYWRIGHT_DOCKER: '1'
        run: npm run check

      - name: Build release 🔨
        run: npm run build:release

      - name: Verify npm publish staging
        run: npm run test:published

      - name: Save release build
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: release-build.tgz
          retention-days: 1

  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    needs: check
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Pin npm
        run: |
          cd "$RUNNER_TEMP"
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - name: Restore release build
        uses: actions/download-artifact@v8
        with:
          name: release-build

      - name: Unpack release build
        run: tar -xzf release-build.tgz

      - name: Version
        id: version
        run: |
          version="$(npm run --silent release:version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the exact-version npm tarball
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/publish-packages.mjs --pack aws-package.tgz

      - name: AWS provisioning credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::174159267544:role/ZeGreatDashboardProvision
          aws-region: us-east-1

      - name: Provision AWS infrastructure
        id: infrastructure
        env:
          CLOUDFORMATION_ROLE_ARN: arn:aws:iam::174159267544:role/ZeGreatDashboardCloudFormationExecution
          GITHUB_OWNER_ID: '6215634'
          GITHUB_REPOSITORY_ID: '1338375095'
        run: npm run --silent release:provision

      # Immutable client publishing does not retain the more powerful provisioning credentials.
      - name: AWS asset publishing credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.infrastructure.outputs.deploy_role_arn }}
          aws-region: us-east-1

      - name: Publish immutable client assets from the tarball
        run: |
          mkdir .reference-consumer
          npm install --prefix .reference-consumer --ignore-scripts --save-exact "$GITHUB_WORKSPACE/aws-package.tgz"
          .reference-consumer/node_modules/.bin/ze-great-dashboard-aws publish-assets \
            --assets-bucket "${{ steps.infrastructure.outputs.assets_bucket }}" \
            --assets-base-url "${{ steps.infrastructure.outputs.assets_base_url }}"

      - name: AWS reference deployment credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.infrastructure.outputs.reference_deploy_role_arn }}
          aws-region: us-east-1

      - name: Deploy the exact tarball as the consumer reference
        run: |
          cp reference/board.yaml reference/aws-dashboard-parameters.json .reference-consumer/
          reference_cli=.reference-consumer/node_modules/.bin/ze-great-dashboard-aws
          "$reference_cli" parameters \
            --artifact-bucket "${{ steps.infrastructure.outputs.reference_artifact_bucket }}" \
            --output .reference-consumer/aws-dashboard-parameters.json
          "$reference_cli" package \
            --board-config .reference-consumer/board.yaml \
            --output .reference-consumer/aws-dashboard-release
          artifact_key="$(jq -er '.artifactKey' .reference-consumer/aws-dashboard-release/release.json)"
          aws s3 cp .reference-consumer/aws-dashboard-release/lambda.zip \
            "s3://${{ steps.infrastructure.outputs.reference_artifact_bucket }}/${artifact_key}" \
            --region us-east-1
          aws cloudformation deploy \
            --stack-name ze-great-dashboard-reference \
            --template-file .reference-consumer/aws-dashboard-release/template.yml \
            --role-arn "${{ steps.infrastructure.outputs.reference_execution_role_arn }}" \
            --region us-east-1 \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides file://.reference-consumer/aws-dashboard-parameters.json \
            --no-fail-on-empty-changeset \
            --no-cli-pager
          function_url="$(aws cloudformation describe-stacks \
            --stack-name ze-great-dashboard-reference \
            --region us-east-1 \
            --query \"Stacks[0].Outputs[?OutputKey=='ServerUrl'].OutputValue\" \
            --output text)"
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "${function_url%/}/health" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "$function_url" > /dev/null

      - name: Publish the same npm tarball
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/publish-packages.mjs --publish-tarball aws-package.tgz

      - name: Confirm the published version is visible
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: test "$(npm view @continuous-excellence/ze-great-dashboard-aws@\"$RELEASE_VERSION\" version --prefer-online)" = "$RELEASE_VERSION"

      - name: Tag verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run --silent release:tag -- "${{ steps.version.outputs.version }}"
