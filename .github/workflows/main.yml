name: Build
on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: |
          cd "$RUNNER_TEMP"
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium

      - name: Check 🔎
        run: npm run check

      - name: Build release 🔨
        run: npm run build:release

      - name: Verify npm publish staging
        run: npm run test:published

      - name: Save release build
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: release-build.tgz
          retention-days: 1

  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    needs: check
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Pin npm
        run: |
          cd "$RUNNER_TEMP"
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - name: Restore release build
        uses: actions/download-artifact@v8
        with:
          name: release-build

      - name: Unpack release build
        run: tar -xzf release-build.tgz

      - name: Version
        id: version
        run: |
          version="$(npm run --silent release:version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the exact-version npm tarball
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/publish-packages.mjs --pack aws-package.tgz

      - name: Verify the tarball as an isolated consumer
        run: npm run test:installed -- ./aws-package.tgz "${{ steps.version.outputs.version }}" --skip-client

      - name: Prepare the production release from the tarball
        run: |
          mkdir .release-consumer
          npm install --prefix .release-consumer --ignore-scripts --save-exact "$GITHUB_WORKSPACE/aws-package.tgz"
          cp boards/example.yaml .release-consumer/board.yaml
          .release-consumer/node_modules/.bin/ze-great-dashboard-aws parameters \
            --artifact-bucket ze-great-dashboard-preflight \
            --output .release-consumer/aws-dashboard-parameters.json
          .release-consumer/node_modules/.bin/ze-great-dashboard-aws package \
            --board-config .release-consumer/board.yaml \
            --output .release-consumer/preflight-release
          .release-consumer/node_modules/.bin/ze-great-dashboard-aws deploy \
            --artifact-dir .release-consumer/preflight-release \
            --assets-bucket unused \
            --assets-base-url https://unused.example \
            --function-name unused \
            --dry-run

      - name: AWS provisioning credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::174159267544:role/ZeGreatDashboardProvision
          aws-region: us-east-1

      - name: Provision AWS infrastructure
        id: infrastructure
        env:
          CLOUDFORMATION_ROLE_ARN: arn:aws:iam::174159267544:role/ZeGreatDashboardCloudFormationExecution
          GITHUB_OWNER_ID: '6215634'
          GITHUB_REPOSITORY_ID: '1338375095'
        run: npm run --silent release:provision

      # Artifact publishing does not retain the more powerful provisioning credentials.
      - name: AWS release credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.infrastructure.outputs.deploy_role_arn }}
          aws-region: us-east-1

      - name: Deploy application 🚀
        run: |
          .release-consumer/node_modules/.bin/ze-great-dashboard-aws package \
            --board-config .release-consumer/board.yaml \
            --output .release-consumer/aws-release
          .release-consumer/node_modules/.bin/ze-great-dashboard-aws deploy \
            --artifact-dir .release-consumer/aws-release \
            --assets-bucket "${{ steps.infrastructure.outputs.assets_bucket }}" \
            --assets-base-url "${{ steps.infrastructure.outputs.assets_base_url }}" \
            --function-name "${{ steps.infrastructure.outputs.function_name }}"

      - name: Smoke test deployed release
        env:
          SERVER_URL: ${{ steps.infrastructure.outputs.server_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "${SERVER_URL}health" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "$SERVER_URL" > /dev/null

      - name: Dogfood the deployment doctor
        run: |
          .release-consumer/node_modules/.bin/ze-great-dashboard-aws parameters \
            --artifact-bucket "${{ steps.infrastructure.outputs.assets_bucket }}" \
            --output .release-consumer/aws-dashboard-parameters.json
          .release-consumer/node_modules/.bin/ze-great-dashboard-aws doctor \
            --parameters .release-consumer/aws-dashboard-parameters.json \
            --region us-east-1

      - name: Publish the same npm tarball
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/publish-packages.mjs --publish-tarball aws-package.tgz

      - name: Verify the exact registry package and hosted client
        run: npm run test:installed -- "${{ steps.version.outputs.version }}"

      - name: Tag verified release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run --silent release:tag -- "${{ steps.version.outputs.version }}"
