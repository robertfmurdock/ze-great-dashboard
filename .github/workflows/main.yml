name: Build
on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  workflow_dispatch:

permissions:
  # Required for the OIDC token exchanged for AWS credentials — no long-lived keys in secrets.
  id-token: write
  # Tagger pushes the version tag.
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.ref }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tagger reads the whole tag history to calculate the next version.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # The same command the pre-commit hook runs. If this fails and the hook passed, the two have
      # drifted, and that is worth fixing rather than working around.
      - name: Check 🔎
        run: npm run check

      - name: Version
        id: version
        run: echo "version=$(npx --yes @continuous-excellence/tagger@3 calculate-version -q)" >> "$GITHUB_OUTPUT"

      - name: Build client 🔨
        run: npm run build

      - name: Build server bundle 🔨
        run: npm run build:lambda --workspace @ze-great-dashboard/server

      # Everything below this line only runs on main. Branches get the full check and build — they
      # just don't publish.
      - name: AWS credentials
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::174159267544:role/ZeGreatDashboardDeploy
          aws-region: us-east-1

      # Assets first, then the function. A version must be fully published before anything can be
      # pointed at it, or a rollout serves 404s for its own JavaScript.
      #
      # index.html is included in the sync — it is part of the published version, and the server
      # fetches it from here at runtime. It is the one file in the bundle that must not be cached
      # hard, because it names the hashed filenames of exactly this version.
      - name: Publish client 🚀
        if: github.ref == 'refs/heads/main'
        env:
          ASSETS_BUCKET: ze-great-dashboard-assets
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          aws s3 sync packages/client/dist "s3://${ASSETS_BUCKET}/dashboard/${VERSION}/" \
            --exclude 'index.html' \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp packages/client/dist/index.html "s3://${ASSETS_BUCKET}/dashboard/${VERSION}/index.html" \
            --cache-control 'public, max-age=60'

      - name: Deploy server 🚀
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FUNCTION_NAME: ze-great-dashboard
          ASSET_BASE: https://assets.dashboard.zegreatrob.com
        run: |
          cd packages/server/dist && zip -q -r ../../../lambda.zip . && cd -
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://lambda.zip \
            --no-cli-pager > /dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

          # The IWA payoff, made operational: promoting a client version is one variable.
          aws lambda update-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --environment "Variables={ASSET_PATH=${ASSET_BASE}/dashboard/${VERSION},HOST=0.0.0.0}" \
            --no-cli-pager > /dev/null
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

      - name: Tag
        if: github.ref == 'refs/heads/main'
        run: npx --yes @continuous-excellence/tagger@3 tag --version "${{ steps.version.outputs.version }}"
