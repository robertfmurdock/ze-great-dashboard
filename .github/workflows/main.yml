name: Build
on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Install Chromium for browser smoke test
        run: npx playwright install --with-deps chromium

      - name: Check 🔎
        run: npm run check

      - name: Build release 🔨
        run: npm run build:release

      - name: Verify npm publish staging
        run: npm run test:published

      - name: Save release build
        uses: actions/upload-artifact@v7
        with:
          name: release-build
          path: release-build.tgz
          retention-days: 1

  release:
    name: Release
    if: github.ref == 'refs/heads/main'
    needs: check
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install release tooling
        run: npm ci --ignore-scripts

      - name: Restore release build
        uses: actions/download-artifact@v8
        with:
          name: release-build

      - name: Unpack release build
        run: tar -xzf release-build.tgz

      - name: Version
        id: version
        run: |
          version="$(npm run --silent release:version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: AWS provisioning credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::174159267544:role/ZeGreatDashboardProvision
          aws-region: us-east-1

      - name: Provision AWS infrastructure
        id: infrastructure
        env:
          CLOUDFORMATION_ROLE_ARN: arn:aws:iam::174159267544:role/ZeGreatDashboardCloudFormationExecution
          GITHUB_OWNER_ID: '6215634'
          GITHUB_REPOSITORY_ID: '1338375095'
        run: npm run --silent release:provision

      - name: Package AWS release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx tsx packages/aws/src/cli.ts package \
            --board-config boards/example.yaml \
            --version "$VERSION" \
            --output aws-release

      # Artifact publishing does not retain the more powerful provisioning credentials.
      - name: AWS release credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.infrastructure.outputs.deploy_role_arn }}
          aws-region: us-east-1

      - name: Deploy application 🚀
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npx tsx packages/aws/src/cli.ts deploy \
            --artifact-dir aws-release \
            --assets-dir aws-release/assets \
            --assets-bucket "${{ steps.infrastructure.outputs.assets_bucket }}" \
            --assets-base-url "${{ steps.infrastructure.outputs.assets_base_url }}" \
            --function-name "${{ steps.infrastructure.outputs.function_name }}" \
            --version "$VERSION"

      - name: Smoke test deployed release
        env:
          SERVER_URL: ${{ steps.infrastructure.outputs.server_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "${SERVER_URL}health" > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
            "$SERVER_URL" > /dev/null

      - name: Tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run --silent release:tag -- "${{ steps.version.outputs.version }}"

  publish:
    name: Publish packages
    if: github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:packages
      - name: Publish packages
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: npm run publish:packages
