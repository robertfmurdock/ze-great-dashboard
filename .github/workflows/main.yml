name: Build
on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      reference_smoke_role_arn: ${{ steps.infrastructure.outputs.reference_smoke_role_arn }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: |
          cd "$RUNNER_TEMP"
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Check 🔎
        env:
          PLAYWRIGHT_DOCKER: '1'
        run: npm run check

      - name: Fetch release history
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --prune --unshallow --tags
          else
            git fetch --prune --tags
          fi

      - name: Calculate release version
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          version="$(npm run --silent release:version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the exact-version npm tarballs
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/publish-packages.mjs --pack client-package.tgz --pack aws-package.tgz

      - name: Log in to GHCR for candidate image
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract candidate Docker image metadata
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        id: candidate-docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and publish candidate Docker image
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        id: candidate-image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.candidate-docker-meta.outputs.tags }}
          labels: ${{ steps.candidate-docker-meta.outputs.labels }}
          build-args: |
            ASSET_PATH=https://public-assets.zegreatrob.com/dashboard/${{ steps.version.outputs.version }}

      - name: AWS provisioning credentials
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::174159267544:role/ZeGreatDashboardProvision
          aws-region: us-east-1

      - name: Check provider bootstrap before provisioning
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        env:
          AWS_REGION: us-east-1
          CLOUDFORMATION_ROLE_ARN: arn:aws:iam::174159267544:role/ze-great-dashboard-cloudformation
          BOOTSTRAP_STACK_NAME: ze-great-dashboard-bootstrap
          BOOTSTRAP_ASSETS_BUCKET_NAME: ze-great-dashboard-assets
          BOOTSTRAP_FUNCTION_NAME: ze-great-dashboard
          BOOTSTRAP_SERVER_ROLE_NAME: ze-great-dashboard-server
          BOOTSTRAP_DEPLOY_ROLE_NAME: ZeGreatDashboardDeploy
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_OWNER_ID: '6215634'
          GITHUB_REPOSITORY_ID: '1338375095'
        run: bash scripts/check-provider-bootstrap.sh

      - name: Provision AWS infrastructure
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        id: infrastructure
        env:
          CLOUDFORMATION_ROLE_ARN: arn:aws:iam::174159267544:role/ze-great-dashboard-cloudformation
          GITHUB_OWNER_ID: '6215634'
          GITHUB_REPOSITORY_ID: '1338375095'
        run: npm run --silent release:provision

      # Candidate asset publishing does not retain the more powerful provisioning credentials.
      - name: AWS candidate asset publishing credentials
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.infrastructure.outputs.deploy_role_arn }}
          aws-region: us-east-1

      - name: Publish candidate client assets from the tarball
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        run: |
          mkdir .candidate-client
          tar -xzf client-package.tgz -C .candidate-client
          client_dir=.candidate-client/package/client
          test -f "$client_dir/index.html"
          test "$(node -p "require('./.candidate-client/package/package.json').version")" = \
            "${{ steps.version.outputs.version }}"
          asset_prefix="dashboard/${{ steps.version.outputs.version }}"
          while IFS= read -r -d '' file; do
            relative_path="${file#"$client_dir"/}"
            object_key="$asset_prefix/$relative_path"
            local_checksum="$(openssl dgst -sha256 -binary "$file" | base64)"
            if existing_checksum="$(aws s3api head-object \
              --bucket "${{ steps.infrastructure.outputs.assets_bucket }}" \
              --key "$object_key" \
              --checksum-mode ENABLED \
              --query ChecksumSHA256 \
              --output text 2>.candidate-client/head-object.err)"; then
              test "$existing_checksum" != None
              test "$existing_checksum" = "$local_checksum" || {
                echo "Immutable S3 collision at $object_key" >&2
                exit 1
              }
            elif ! grep -Eq '404|Not Found|HeadObject' .candidate-client/head-object.err; then
              cat .candidate-client/head-object.err >&2
              exit 1
            fi
          done < <(find "$client_dir" -type f -print0)
          aws s3 sync "$client_dir" \
            "s3://${{ steps.infrastructure.outputs.assets_bucket }}/dashboard/${{ steps.version.outputs.version }}/" \
            --exclude index.html \
            --checksum-algorithm SHA256 \
            --cache-control 'public, max-age=31536000, immutable'
          aws s3 cp "$client_dir/index.html" \
            "s3://${{ steps.infrastructure.outputs.assets_bucket }}/dashboard/${{ steps.version.outputs.version }}/index.html" \
            --checksum-algorithm SHA256 \
            --cache-control 'public, max-age=60'

      - name: AWS reference deployment credentials
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.infrastructure.outputs.reference_deploy_role_arn }}
          aws-region: us-east-1

      - name: Deploy and check the exact tarball as the consumer reference
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        env:
          AWS_REGION: us-east-1
          REFERENCE_RELEASE_DIR: .reference-consumer/aws-dashboard-release
          REFERENCE_ARTIFACT_BUCKET: ${{ steps.infrastructure.outputs.reference_artifact_bucket }}
          REFERENCE_EXECUTION_ROLE_ARN: ${{ steps.infrastructure.outputs.reference_execution_role_arn }}
          REFERENCE_SECRET_ARN: ${{ steps.infrastructure.outputs.reference_credential_smoke_secret_arn }}
          REFERENCE_PARAMETER_ARN: ${{ steps.infrastructure.outputs.reference_credential_smoke_parameter_arn }}
        run: |
          cp reference/credential-smoke-board.yaml .reference-consumer/board.yaml
          cp reference/aws-dashboard-parameters.json .reference-consumer/
          reference_cli=.reference-consumer/node_modules/.bin/ze-great-dashboard-aws
          aws ssm put-parameter \
            --name /ze-great-dashboard-reference-credentials-smoke \
            --type SecureString \
            --value '{"GITHUB_TOKEN":"smoke-placeholder"}' \
            --tier Standard \
            --overwrite \
            --region us-east-1
          "$reference_cli" parameters \
            --artifact-bucket "${{ steps.infrastructure.outputs.reference_artifact_bucket }}" \
            --output .reference-consumer/aws-dashboard-parameters.json
          jq --arg secret_arn "${{ steps.infrastructure.outputs.reference_credential_smoke_secret_arn }}" \
            '. + [{"ParameterKey":"SecretReference","ParameterValue":$secret_arn}]' \
            .reference-consumer/aws-dashboard-parameters.json \
            > .reference-consumer/aws-dashboard-parameters.with-secret.json
          mv .reference-consumer/aws-dashboard-parameters.with-secret.json .reference-consumer/aws-dashboard-parameters.json
          "$reference_cli" package \
            --board-config .reference-consumer/board.yaml \
            --parameters .reference-consumer/aws-dashboard-parameters.json \
            --output .reference-consumer/aws-dashboard-release
          bash scripts/deploy-reference-composition.sh

      - name: Assume Docker smoke-test credentials
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.infrastructure.outputs.reference_smoke_role_arn }}
          aws-region: us-east-1

      - name: Package and validate the ECS release template
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        run: |
          cp reference/board.yaml .ecs-consumer-board.yaml
          cp reference/aws-dashboard-ecs-parameters.json .ecs-parameters.json
          reference_cli=.reference-consumer/node_modules/.bin/ze-great-dashboard-aws
          "$reference_cli" package --mode ecs \
            --board-config .ecs-consumer-board.yaml \
            --parameters .ecs-parameters.json \
            --image "ghcr.io/${{ github.repository }}@${{ steps.candidate-image.outputs.digest }}" \
            --output .ecs-release
          test "$(jq -er '.computeMode' .ecs-release/release.json)" = ecs
          test -n "$(jq -er '.image' .ecs-release/release.json)"
          grep -q 'AWS::ECS::Service' .ecs-release/template.yml
          grep -Eq 'AllowedValues: \[ ?ecs ?\]' .ecs-release/template.yml

      - name: Run ephemeral ECS Docker smoke test
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        run: |
          export IMAGE="$(jq -er '.image' .ecs-release/release.json)"
          for attempt in 1 2 3; do
            echo "ECS Docker smoke-test attempt $attempt/3"
            if bash scripts/test-ecs-image.sh; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo 'ECS Docker smoke test did not pass; retrying in 10 seconds.' >&2
              sleep 10
            fi
          done
          echo 'ECS Docker smoke test failed after 3 attempts.' >&2
          exit 1

      - name: Save verified release candidate
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-candidate
          path: |
            client-package.tgz
            aws-package.tgz
          retention-days: 1

  consumer-bootstrap-validation:
    name: Validate consumer bootstrap candidate
    if: github.ref == 'refs/heads/main' && endsWith(needs.check.outputs.version, '-SNAPSHOT') != true
    needs: check
    runs-on: ubuntu-latest
    environment: consumer-bootstrap-validation
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      CANDIDATE_VERSION: ${{ needs.check.outputs.version }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Load checked-in validation configuration
        run: |
          echo "AWS_REGION=$(jq -er '.region' reference/consumer-bootstrap-validation.json)" >> "$GITHUB_ENV"
          echo "STACK_NAME=$(jq -er '.core.applicationStackName' reference/consumer-bootstrap-validation.json)" >> "$GITHUB_ENV"

      - name: Restore verified release candidate
        uses: actions/download-artifact@v8
        with:
          name: verified-release-candidate

      - name: Install and verify the exact candidate AWS interface
        run: |
          npm install --prefix .consumer-bootstrap-validation --ignore-scripts --save-exact \
            "$GITHUB_WORKSPACE/aws-package.tgz"
          installed_version="$(node -p \
            "require('./.consumer-bootstrap-validation/node_modules/@continuous-excellence/ze-great-dashboard-aws/package.json').version")"
          test "$installed_version" = "$CANDIDATE_VERSION"

      - name: Resolve candidate desired state for validation
        run: |
          validation_config="$RUNNER_TEMP/consumer-bootstrap-validation.json"
          cp reference/consumer-bootstrap-validation.json "$validation_config"
          .consumer-bootstrap-validation/node_modules/.bin/ze-great-dashboard-aws \
            bootstrap upgrade --config "$validation_config" --format json > "$RUNNER_TEMP/bootstrap-upgrade.json"
          echo "VALIDATION_CONFIG=$validation_config" >> "$GITHUB_ENV"

      - name: Require reviewed bootstrap outputs
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$CLOUDFORMATION_EXECUTION_ROLE_ARN"

      - name: Assume the generated GitHub deploy role
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Validate bootstrap consistency (read-only)
        id: bootstrap-validation
        run: |
          validation_cli=.consumer-bootstrap-validation/node_modules/.bin/ze-great-dashboard-aws
          report_dir="$RUNNER_TEMP/consumer-bootstrap-recovery"
          mkdir -p "$report_dir"
          if "$validation_cli" bootstrap check \
            --config "$VALIDATION_CONFIG" \
            --format text > "$report_dir/bootstrap-check.txt" 2>&1; then
            cat "$report_dir/bootstrap-check.txt"
          else
            check_status=$?
            "$validation_cli" bootstrap check \
              --config "$VALIDATION_CONFIG" \
              --format json > "$report_dir/bootstrap-remediation.json" || true
            cat "$report_dir/bootstrap-check.txt"
            jq -r '.remediation.recoveryCommands[] | "\(.name): \(.command)"' \
              "$report_dir/bootstrap-remediation.json" > "$report_dir/recovery-commands.txt"
            guide="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/aws-bootstrap-upgrade.md"
            {
              echo '## Consumer bootstrap recovery'
              echo
              echo "Commit-pinned runbook: $guide"
              echo
              echo '```text'
              cat "$report_dir/bootstrap-check.txt"
              echo
              echo 'Generated commands:'
              cat "$report_dir/recovery-commands.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Consumer bootstrap requires administrator update::Bootstrap consistency failed. Apply both affected stack updates only after review, using the recovery commands in the step summary and the commit-pinned runbook: $guide"
            exit "$check_status"
          fi

      - name: Upload bootstrap recovery handoff
        if: failure() && steps.bootstrap-validation.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: consumer-bootstrap-recovery-${{ github.run_id }}
          path: ${{ runner.temp }}/consumer-bootstrap-recovery
          if-no-files-found: error

      - name: Package and deploy the source-free reference board
        run: |
          validation_cli=.consumer-bootstrap-validation/node_modules/.bin/ze-great-dashboard-aws
          "$validation_cli" parameters \
            --bootstrap-config "$VALIDATION_CONFIG" \
            --output aws-dashboard-parameters.json
          "$validation_cli" package \
            --board-config reference/board.yaml \
            --parameters aws-dashboard-parameters.json \
            --output aws-dashboard-release
          aws s3 cp aws-dashboard-release/lambda.zip \
            "$(jq -er '.commands.upload[4]' aws-dashboard-release/deployment.json)" \
            --region "$AWS_REGION"
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file aws-dashboard-release/template.yml \
            --role-arn "$CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides file://aws-dashboard-release/parameters.json \
            --no-fail-on-empty-changeset \
            --no-cli-pager

  release:
    name: Release
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.check.result == 'success' &&
      (endsWith(needs.check.outputs.version, '-SNAPSHOT') ||
      needs.consumer-bootstrap-validation.result == 'success')
    needs: [check, consumer-bootstrap-validation]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Pin npm
        run: |
          cd "$RUNNER_TEMP"
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"

      - name: Install tagging tooling
        run: npm ci --ignore-scripts

      - name: Restore verified release candidate
        uses: actions/download-artifact@v8
        with:
          name: verified-release-candidate

      - name: Publish the same npm tarball
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          node scripts/publish-packages.mjs --publish-tarball client-package.tgz
          node scripts/publish-packages.mjs --publish-tarball aws-package.tgz

      - name: Confirm the published versions are visible
        if: endsWith(needs.check.outputs.version, '-SNAPSHOT') != true
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          for package in \
            @continuous-excellence/ze-great-dashboard-client \
            @continuous-excellence/ze-great-dashboard-aws; do
            for attempt in {1..12}; do
              published_version="$(npm view "$package@$RELEASE_VERSION" version --prefer-online 2>/dev/null || true)"
              if [ "$published_version" = "$RELEASE_VERSION" ]; then break; fi
              sleep 5
            done
            test "$published_version" = "$RELEASE_VERSION"
          done

      - name: Log in to GHCR
        if: endsWith(needs.check.outputs.version, '-SNAPSHOT') != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified Docker image to latest
        if: endsWith(needs.check.outputs.version, '-SNAPSHOT') != true
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            "ghcr.io/${{ github.repository }}:${{ needs.check.outputs.version }}"

      - name: Tag verified release
        if: endsWith(needs.check.outputs.version, '-SNAPSHOT') != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run --silent release:tag -- "${{ needs.check.outputs.version }}"
