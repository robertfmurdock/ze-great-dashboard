name: Build
on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}

jobs:
  check:
    name: Build and check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      reference_smoke_role_arn: ${{ steps.infrastructure.outputs.reference_smoke_role_arn }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Pin npm
        run: |
          cd "$RUNNER_TEMP"
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"

      - name: Install
        run: npm ci --ignore-scripts

      - name: Check 🔎
        env:
          PLAYWRIGHT_DOCKER: '1'
        run: npm run check

      - name: Fetch release history
        if: github.ref == 'refs/heads/main'
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            git fetch --prune --unshallow --tags
          else
            git fetch --prune --tags
          fi

      - name: Calculate release version
        if: github.ref == 'refs/heads/main'
        id: version
        run: |
          version="$(npm run --silent release:version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the exact-version npm tarball
        if: github.ref == 'refs/heads/main'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/publish-packages.mjs --pack aws-package.tgz

      - name: Log in to GHCR for candidate image
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract candidate Docker image metadata
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        id: candidate-docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: type=raw,value=${{ steps.version.outputs.version }}

      - name: Build and publish candidate Docker image
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.candidate-docker-meta.outputs.tags }}
          labels: ${{ steps.candidate-docker-meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.version }}

      - name: AWS provisioning credentials
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::174159267544:role/ZeGreatDashboardProvision
          aws-region: us-east-1

      - name: Check provider bootstrap before provisioning
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        env:
          AWS_REGION: us-east-1
          CLOUDFORMATION_ROLE_ARN: arn:aws:iam::174159267544:role/ze-great-dashboard-cloudformation
          BOOTSTRAP_STACK_NAME: ze-great-dashboard-bootstrap
          BOOTSTRAP_ASSETS_BUCKET_NAME: ze-great-dashboard-assets
          BOOTSTRAP_FUNCTION_NAME: ze-great-dashboard
          BOOTSTRAP_SERVER_ROLE_NAME: ze-great-dashboard-server
          BOOTSTRAP_DEPLOY_ROLE_NAME: ZeGreatDashboardDeploy
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_OWNER_ID: '6215634'
          GITHUB_REPOSITORY_ID: '1338375095'
        run: bash scripts/check-provider-bootstrap.sh

      - name: Provision AWS infrastructure
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        id: infrastructure
        env:
          CLOUDFORMATION_ROLE_ARN: arn:aws:iam::174159267544:role/ze-great-dashboard-cloudformation
          GITHUB_OWNER_ID: '6215634'
          GITHUB_REPOSITORY_ID: '1338375095'
        run: npm run --silent release:provision

      # Candidate asset publishing does not retain the more powerful provisioning credentials.
      - name: AWS candidate asset publishing credentials
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.infrastructure.outputs.deploy_role_arn }}
          aws-region: us-east-1

      - name: Publish candidate client assets from the tarball
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        run: |
          mkdir .reference-consumer
          npm install --prefix .reference-consumer --ignore-scripts --save-exact "$GITHUB_WORKSPACE/aws-package.tgz"
          .reference-consumer/node_modules/.bin/ze-great-dashboard-aws publish-assets \
            --assets-bucket "${{ steps.infrastructure.outputs.assets_bucket }}" \
            --assets-base-url "${{ steps.infrastructure.outputs.assets_base_url }}"

      - name: AWS reference deployment credentials
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.infrastructure.outputs.reference_deploy_role_arn }}
          aws-region: us-east-1

      - name: Deploy and check the exact tarball as the consumer reference
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        run: |
          cp reference/credential-smoke-board.yaml .reference-consumer/board.yaml
          cp reference/aws-dashboard-parameters.json .reference-consumer/
          reference_cli=.reference-consumer/node_modules/.bin/ze-great-dashboard-aws
          "$reference_cli" parameters \
            --artifact-bucket "${{ steps.infrastructure.outputs.reference_artifact_bucket }}" \
            --output .reference-consumer/aws-dashboard-parameters.json
          jq --arg secret_arn "${{ steps.infrastructure.outputs.reference_credential_smoke_secret_arn }}" \
            '. + [{"ParameterKey":"SecretReference","ParameterValue":$secret_arn}]' \
            .reference-consumer/aws-dashboard-parameters.json \
            > .reference-consumer/aws-dashboard-parameters.next.json
          mv .reference-consumer/aws-dashboard-parameters.next.json .reference-consumer/aws-dashboard-parameters.json
          "$reference_cli" package \
            --board-config .reference-consumer/board.yaml \
            --parameters .reference-consumer/aws-dashboard-parameters.json \
            --output .reference-consumer/aws-dashboard-release
          artifact_key="$(jq -er '.artifactKey' .reference-consumer/aws-dashboard-release/release.json)"
          aws s3 cp .reference-consumer/aws-dashboard-release/lambda.zip \
            "$(jq -er '.commands.upload[4]' .reference-consumer/aws-dashboard-release/deployment.json)" \
            --region us-east-1
          reference_status="$(aws cloudformation describe-stacks \
            --stack-name ze-great-dashboard-reference \
            --region us-east-1 \
            --query 'Stacks[0].StackStatus' \
            --output text 2>/dev/null || true)"
          if [ "$reference_status" = ROLLBACK_COMPLETE ]; then
            aws cloudformation delete-stack \
              --stack-name ze-great-dashboard-reference \
              --region us-east-1
            aws cloudformation wait stack-delete-complete \
              --stack-name ze-great-dashboard-reference \
              --region us-east-1
          fi
          aws cloudformation deploy \
            --stack-name ze-great-dashboard-reference \
            --template-file .reference-consumer/aws-dashboard-release/template.yml \
            --role-arn "${{ steps.infrastructure.outputs.reference_execution_role_arn }}" \
            --region us-east-1 \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides file://.reference-consumer/aws-dashboard-release/parameters.json \
            --no-fail-on-empty-changeset \
            --no-cli-pager
          expected_asset_path="$(jq -er '.clientAssetUrl' .reference-consumer/aws-dashboard-release/release.json)"
          deployed_asset_path="$(aws cloudformation describe-stacks \
            --stack-name ze-great-dashboard-reference --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='AssetPath'].OutputValue" --output text)"
          deployed_artifact_key="$(aws cloudformation describe-stacks \
            --stack-name ze-great-dashboard-reference --region us-east-1 \
            --query "Stacks[0].Parameters[?ParameterKey=='LambdaArtifactKey'].ParameterValue" --output text)"
          [ "$deployed_asset_path" = "$expected_asset_path" ]
          [ "$deployed_artifact_key" = "$artifact_key" ]
          function_arn="$(aws cloudformation describe-stacks \
            --stack-name ze-great-dashboard-reference \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='ServerFunctionArn'].OutputValue" \
            --output text)"
          aws lambda invoke --function-name "$function_arn" --invocation-type RequestResponse \
            --payload '{"version":"2.0","rawPath":"/health","requestContext":{"http":{"method":"GET"}}}' \
            --cli-binary-format raw-in-base64-out --region us-east-1 /tmp/reference-health.json
          jq -e '.statusCode == 200' /tmp/reference-health.json > /dev/null

      - name: Assume Docker smoke-test credentials
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ steps.infrastructure.outputs.reference_smoke_role_arn }}
          aws-region: us-east-1

      - name: Run ephemeral ECS Docker smoke test
        if: github.ref == 'refs/heads/main' && endsWith(steps.version.outputs.version, '-SNAPSHOT') != true
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
        run: bash scripts/test-ecs-image.sh

      - name: Save verified release candidate
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-candidate
          path: aws-package.tgz
          retention-days: 1

  consumer-bootstrap-validation:
    name: Validate consumer bootstrap candidate
    if: github.ref == 'refs/heads/main' && endsWith(needs.check.outputs.version, '-SNAPSHOT') != true
    needs: check
    runs-on: ubuntu-latest
    environment: consumer-bootstrap-validation
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      CANDIDATE_VERSION: ${{ needs.check.outputs.version }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Load checked-in validation configuration
        run: |
          echo "AWS_REGION=$(jq -er '.region' reference/consumer-bootstrap-validation.json)" >> "$GITHUB_ENV"
          echo "STACK_NAME=$(jq -er '.core.applicationStackName' reference/consumer-bootstrap-validation.json)" >> "$GITHUB_ENV"

      - name: Restore verified release candidate
        uses: actions/download-artifact@v8
        with:
          name: verified-release-candidate

      - name: Install and verify the exact candidate AWS interface
        run: |
          npm install --prefix .consumer-bootstrap-validation --ignore-scripts --save-exact \
            "$GITHUB_WORKSPACE/aws-package.tgz"
          installed_version="$(node -p \
            "require('./.consumer-bootstrap-validation/node_modules/@continuous-excellence/ze-great-dashboard-aws/package.json').version")"
          test "$installed_version" = "$CANDIDATE_VERSION"

      - name: Require reviewed bootstrap outputs
        run: |
          test -n "$AWS_DEPLOY_ROLE_ARN"
          test -n "$CLOUDFORMATION_EXECUTION_ROLE_ARN"

      - name: Assume the generated GitHub deploy role
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ env.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check live bootstrap consistency
        run: |
          validation_cli=.consumer-bootstrap-validation/node_modules/.bin/ze-great-dashboard-aws
          "$validation_cli" bootstrap check \
            --config reference/consumer-bootstrap-validation.json \
            --format text

      - name: Package and deploy the source-free reference board
        run: |
          validation_cli=.consumer-bootstrap-validation/node_modules/.bin/ze-great-dashboard-aws
          "$validation_cli" parameters \
            --bootstrap-config reference/consumer-bootstrap-validation.json \
            --output aws-dashboard-parameters.json
          "$validation_cli" package \
            --board-config reference/board.yaml \
            --parameters aws-dashboard-parameters.json \
            --output aws-dashboard-release
          aws s3 cp aws-dashboard-release/lambda.zip \
            "$(jq -er '.commands.upload[4]' aws-dashboard-release/deployment.json)" \
            --region "$AWS_REGION"
          aws cloudformation deploy \
            --stack-name "$STACK_NAME" \
            --template-file aws-dashboard-release/template.yml \
            --role-arn "$CLOUDFORMATION_EXECUTION_ROLE_ARN" \
            --region "$AWS_REGION" \
            --capabilities CAPABILITY_NAMED_IAM \
            --parameter-overrides file://aws-dashboard-release/parameters.json \
            --no-fail-on-empty-changeset \
            --no-cli-pager

  release:
    name: Release
    if: >-
      always() && github.ref == 'refs/heads/main' && needs.check.result == 'success' &&
      (endsWith(needs.check.outputs.version, '-SNAPSHOT') ||
      needs.consumer-bootstrap-validation.result == 'success')
    needs: [check, consumer-bootstrap-validation]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Pin npm
        run: |
          cd "$RUNNER_TEMP"
          npm install --global npm@11.19.0
          test "$(npm --version)" = "11.19.0"

      - name: Install tagging tooling
        run: npm ci --ignore-scripts

      - name: Restore verified release candidate
        uses: actions/download-artifact@v8
        with:
          name: verified-release-candidate

      - name: Publish the same npm tarball
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: node scripts/publish-packages.mjs --publish-tarball aws-package.tgz

      - name: Confirm the published version is visible
        if: endsWith(needs.check.outputs.version, '-SNAPSHOT') != true
        env:
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: |
          for attempt in {1..12}; do
            published_version="$(npm view "@continuous-excellence/ze-great-dashboard-aws@$RELEASE_VERSION" version --prefer-online 2>/dev/null || true)"
            if [ "$published_version" = "$RELEASE_VERSION" ]; then exit 0; fi
            sleep 5
          done
          test "$published_version" = "$RELEASE_VERSION"

      - name: Log in to GHCR
        if: endsWith(needs.check.outputs.version, '-SNAPSHOT') != true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote verified Docker image to latest
        if: endsWith(needs.check.outputs.version, '-SNAPSHOT') != true
        run: |
          docker buildx imagetools create \
            --tag "ghcr.io/${{ github.repository }}:latest" \
            "ghcr.io/${{ github.repository }}:${{ needs.check.outputs.version }}"

      - name: Tag verified release
        if: endsWith(needs.check.outputs.version, '-SNAPSHOT') != true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run --silent release:tag -- "${{ needs.check.outputs.version }}"
