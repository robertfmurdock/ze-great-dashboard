name: Auth0 functional API checks

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: auth0-functional-api
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Auth0 functional reader credentials
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::174159267544:role/ZeGreatDashboardAuth0FunctionalReader
          aws-region: us-east-1
      - name: Run Auth0 API functional checks
        run: npm run test:auth0-functional
