name: Auth0 functional API checks

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

concurrency:
  group: auth0-functional-api
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  functional:
    runs-on: ubuntu-latest
    environment: auth0-functional
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts
      - name: Run Auth0 API functional checks
        env:
          AUTH0_FUNCTIONAL_TEST_RUNNER_CLIENT_SECRET: ${{ secrets.AUTH0_FUNCTIONAL_TEST_RUNNER_CLIENT_SECRET }}
          AUTH0_FUNCTIONAL_ALLOWED_PASSWORD: ${{ secrets.AUTH0_FUNCTIONAL_ALLOWED_PASSWORD }}
          AUTH0_FUNCTIONAL_UNLISTED_PASSWORD: ${{ secrets.AUTH0_FUNCTIONAL_UNLISTED_PASSWORD }}
        run: npm run test:auth0-functional
